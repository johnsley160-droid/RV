<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/icons/favicon.png">
<!--RV-ADMIN-HEAD-END-->
<title>RV Kitchen Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* RV Kitchen · Admin panel. Same look as the customer app: light shell, white cards, orange brand. */
:root{
  --bg:#F3F2F1; --card:#FFFFFF; --text:#1D1A18; --muted:#6F6862; --line:#E8E4E0; --line2:#F1EEEB;
  --brand:#E86500; --brand-dark:#B04A00; --brand-ink:#FFFFFF; --brand-soft:#FFEEDB;
  --ok:#17904F; --ok-soft:#E3F4EA; --bad:#C9301D; --bad-soft:#FBE7E4; --warn-soft:#FFF3D6; --warn:#8A5A00;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .lg{width:36px;height:36px;border-radius:10px;background:#0B0908;display:grid;place-items:center;overflow:hidden;flex:none}
.brand .lg img{width:90%}
.brand b{font-size:16px;font-weight:900;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.tlink{font-weight:800;font-size:14px;padding:8px 10px;border-radius:10px;color:var(--text);text-decoration:none;white-space:nowrap}
.tlink:hover{background:var(--bg)}
.tabsbar{background:var(--card);border-bottom:1px solid var(--line)}
.tabsbar .wrap{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none}
.tabsbar .wrap::-webkit-scrollbar{display:none}
.tab{white-space:nowrap}
.tab{padding:12px 0 10px;font-weight:800;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--brand)}

main{padding:16px 0 80px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 0 var(--line)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.card h2 .sub{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}
.grid{display:grid;gap:12px}
.sec{margin-top:12px}
.hint{color:var(--muted);font-size:13px;font-weight:600}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:11px 13px;font-weight:800;font-size:14px;margin:10px 0 0}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:11px 13px;font-weight:800;font-size:14px;margin:10px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:900;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--card);color:var(--bad);border:1.5px solid #F0C9C3}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}

/* sign in */
.login{max-width:400px;margin:8vh auto 0;text-align:center}
.login .lg{width:84px;height:84px;border-radius:22px;background:#0B0908;display:grid;place-items:center;margin:0 auto 14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.login .lg img{width:90%}
.login h1{font-size:24px;font-weight:900;margin:0 0 4px}
.login form{display:grid;gap:10px;margin-top:18px;text-align:left}
.fld{display:grid;gap:6px;font-weight:800;font-size:13.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 13px;background:var(--card);color:var(--text);font-weight:600;font-size:15.5px}
.fld textarea{height:auto;min-height:64px;padding:10px 13px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.steps{margin:10px 0 0;padding-left:20px;text-align:left;font-weight:600;font-size:14px;line-height:1.6}

/* at a glance */
.glance{grid-template-columns:repeat(2,minmax(0,1fr))}
.gl{text-align:left;background:var(--card);border-radius:16px;padding:14px;border:2px solid transparent;box-shadow:0 1px 0 var(--line)}
.gl[aria-pressed="true"]{border-color:var(--brand)}
.gl small{display:block;font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.gl b{display:block;font-size:22px;font-weight:900;margin-top:4px;letter-spacing:-.3px}
.gl span{display:block;font-size:13.5px;font-weight:700;color:var(--muted)}

/* period navigator */
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{height:36px;padding:0 14px;border-radius:9px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--card)}
.nav button[disabled]{opacity:.35;cursor:default}
.nav .lbl{font-weight:900;font-size:15px;min-width:150px;text-align:center}

/* KPI tiles */
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi small{display:block;font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-size:26px;font-weight:900;margin-top:2px;letter-spacing:-.4px}
.kpi .dl{font-size:13px;font-weight:800;margin-top:2px;display:flex;align-items:center;gap:4px;color:var(--muted)}
.kpi .dl.up{color:var(--ok)} .kpi .dl.down{color:var(--bad)}
.kpi .foot{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:4px}

/* bar chart: one series, metric switch, hover/tap tooltip */
.chart{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:200px auto;column-gap:8px}
.yax{position:relative;font-size:11.5px;color:var(--muted);font-weight:700;text-align:right;min-width:34px}
.yax span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;border-bottom:1px solid #CFC8C2}
.plot .gl-line{position:absolute;left:0;right:0;border-top:1px solid var(--line2)}
.cols{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0;position:relative}
.col .bar{width:100%;max-width:38px;background:var(--brand);border-radius:4px 4px 0 0;min-height:0}
.col:hover .bar,.col:focus-visible .bar,.col.on .bar{background:var(--brand-dark)}
.xax{grid-column:2;display:flex;gap:2px;font-size:11px;color:var(--muted);font-weight:700;padding-top:6px}
.xax span{flex:1;text-align:center;min-width:0;white-space:nowrap;overflow:visible}
.tip{position:absolute;z-index:5;background:var(--text);color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip b{display:block;font-weight:900}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font-weight:700}

/* breakdown lists */
.brk{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.brow .nm{font-weight:800;font-size:14.5px}
.brow .vl{font-weight:800;font-size:14px;text-align:right}
.brow .vl small{color:var(--muted);font-weight:700;margin-left:6px}
.brow .track{grid-column:1/-1;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.brow .track i{display:block;height:100%;background:var(--brand);border-radius:4px}

/* table */
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
th{text-align:left;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line2);vertical-align:top;font-weight:600}
td.r,th.r{text-align:right}
td{white-space:nowrap}
td .its{color:var(--muted);font-size:13px;max-width:280px;white-space:normal;min-width:180px}
.st{font-size:12px;font-weight:900;border-radius:6px;padding:3px 8px;white-space:nowrap;display:inline-block}
.st.pend,.st.prep{background:var(--brand-soft);color:var(--brand-dark)}
.st.listo{background:var(--warn-soft);color:var(--warn)}
.st.entregado{background:var(--ok-soft);color:var(--ok)}
.st.cancelado{background:var(--bad-soft);color:var(--bad)}
.tag{font-size:12px;font-weight:800;color:var(--muted)}
.skel{height:120px;border-radius:12px;background:linear-gradient(90deg,#ece9e6,#f6f4f2,#ece9e6);background-size:200% 100%}

/* slideshow editor */
.preview{position:relative;aspect-ratio:2/1;border-radius:14px;overflow:hidden;background:#0B0908}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s ease}
.slide.on{opacity:1}
.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0) 62%)}
.slide-cap{position:absolute;left:16px;right:70px;bottom:14px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.slide-cap b{display:block;font-size:19px;font-weight:900;line-height:1.15}
.slide-cap span{display:block;margin-top:3px;font-size:13px;font-weight:700;opacity:.94}
.slide-tag{position:absolute;top:12px;left:12px;background:var(--brand);color:#fff;font-size:11px;font-weight:900;letter-spacing:.5px;border-radius:7px;padding:4px 8px;text-transform:uppercase}
.pdots{position:absolute;right:14px;bottom:16px;display:flex;gap:7px}
.pdots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.5)}
.pdots i.on{width:26px;background:#fff}
.slist{display:grid;gap:12px}
.scard{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 0 var(--line)}
.scard.off{opacity:.62}
.sthumb{position:relative;aspect-ratio:2/1;border-radius:10px;background:#0B0908 center/cover no-repeat;overflow:hidden}
.sthumb .n{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;font-weight:900;font-size:12px;border-radius:6px;padding:2px 7px}
.sfields{display:grid;gap:10px;min-width:0}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.toggle .sw{width:42px;height:24px;border-radius:12px;background:#CFC8C2;position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"] .sw{background:var(--ok)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(18px)}
.icon-b{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--card)}
.icon-b[disabled]{opacity:.35;cursor:default}
.savebar{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px}
.savebar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savebar .msg{margin-right:auto;font-weight:800;font-size:14px;color:var(--muted)}
.savebar .msg.dirty{color:var(--brand-dark)}
.demo{background:#FFF3D6;color:#6B4700;font-size:12.5px;font-weight:800;text-align:center;padding:6px 16px}

/* inventory */
.chip-st{font-size:12px;font-weight:900;border-radius:6px;padding:3px 8px;white-space:nowrap;display:inline-block}
.chip-st.ok{background:var(--ok-soft);color:var(--ok)} .chip-st.low{background:var(--warn-soft);color:var(--warn)} .chip-st.out{background:var(--bad-soft);color:var(--bad)} .chip-st.nc{background:var(--line2);color:var(--muted)}
.stockn{font-size:18px;font-weight:900}
.stockn.neg{color:var(--bad)}
.minirow{display:flex;gap:6px;flex-wrap:wrap}
.inline{background:var(--bg);border-radius:12px;padding:12px;margin-top:8px;display:grid;gap:10px}
.inline .fld input,.inline .fld select{height:42px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.rec:first-child{border-top:0}
.rec .nm{font-weight:800}
.rec .uses{grid-column:1/-1;color:var(--muted);font-size:13px;font-weight:700}
.recline{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:end}
.recline .u{font-size:12px;color:var(--muted);font-weight:800}
.alerts{display:flex;gap:8px;flex-wrap:wrap}
.logrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
.logrow:first-child{border-top:0}
.logrow .w{color:var(--muted);font-weight:700;font-size:13px}
.logrow .ch{color:var(--muted);font-weight:600;font-size:13px}
@media (max-width:759px){.logrow{grid-template-columns:1fr}.recline{grid-template-columns:minmax(0,1fr) 90px auto}}
@media (min-width:760px){
  .glance{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .two{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .chart{grid-template-rows:240px auto}
  .preview{aspect-ratio:16/6}
  .slide-cap b{font-size:24px}
}
@media (max-width:759px){
  .two>*+*{margin-top:12px}
  .nav{margin-left:0;width:100%;justify-content:space-between}
  .nav .lbl{min-width:0;flex:1}
  .scard{grid-template-columns:1fr}
  .tlink.hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<!--RV-ADMIN-DEMO-->
<script>
/* ============ RV Kitchen · admin panel ============
   Talks to server.js → /api/admin/* with the access code (x-rv-code header).
   If window.RV_ADMIN_DEMO exists (demo build), it uses that instead. */
const DEMO = window.RV_ADMIN_DEMO || null;
const LOGO = DEMO ? DEMO.logo : '/photos/logo.png';
let CUSTOMER_URL = DEMO ? DEMO.customerUrl : '/pedir';
let ON_ADMIN_DOMAIN = false;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
store.del('rv_admin_code');                       // old access-code sign-in is no longer used
let TOKEN = store.get('rv_admin_token') || '';     // stays signed in for 30 days on this device

async function call(method, url, body) {
  if (DEMO) return DEMO.call(method, url, body);
  const headers = { 'x-rv-admin': TOKEN };
  if (body) headers['Content-Type'] = 'application/json';
  const r = await fetch('/api/admin' + url, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Something went wrong (' + r.status + ').'); e.status = r.status; e.needsCode = !!j.needsCode; throw e; }
  return j;
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => 'RD$ ' + Math.round(n || 0).toLocaleString('en-US');
const money2 = n => { const v = Math.round((n || 0) * 100) / 100; return 'RD$ ' + v.toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 }); };
const int = n => Math.round(n || 0).toLocaleString('en-US');
const D = s => new Date(s + 'T00:00:00Z');
const ymd = d => d.toISOString().slice(0, 10);
const addD = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return ymd(d); };
const weekStart = s => addD(s, -((D(s).getUTCDay() + 6) % 7));    // weeks start on Monday
const monthStart = s => s.slice(0, 8) + '01';
const addM = (s, n) => { const d = D(monthStart(s)); d.setUTCMonth(d.getUTCMonth() + n); return ymd(d); };
const monthEnd = s => addD(addM(s, 1), -1);
const fmtD = (s, o) => D(s).toLocaleDateString('en-US', Object.assign({ timeZone: 'UTC' }, o));
const hourLbl = h => (h % 12 || 12) + (h < 12 ? ' am' : ' pm');
const PAY = { efectivo: 'Cash', tarjeta: 'Card', transferencia: 'Bank transfer', otro: 'Other' };
const TYPE = { delivery: 'Delivery', llevar: 'Takeout', aqui: 'Dine-in' };
const STATUS = { pend: 'New', prep: 'Preparing', listo: 'Ready / on the way', entregado: 'Delivered', cancelado: 'Cancelled' };
const I = {
  left: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  up: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  photo: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ---------- state ---------- */
const A = {
  authed: false, checking: !!TOKEN, loginErr: '', user: '', defaultPw: false, persistent: true, onRailway: false,
  pwMsg: '', pwErr: '', pwBusy: false, er: { orders: true, customers: true, err: '', msg: '', busy: false },
  view: 'sales', today: null, days: [], loadErr: '', ch: 'all',
  kind: 'day', anchor: null, metric: 'rev',
  orders: null, ordersErr: '', ordersKey: '',
  slides: null, items: [], seconds: 4, dirty: false, saving: false, sMsg: '', sErr: '', pv: 0,
  askDel: -1, askReset: false, showN: 20,
  custs: null, custErr: '', custQ: '', askPw: '', temp: {},
  inv: null, invErr: '', invMsg: '', invEdit: null, invMove: null, recEdit: null, recCat: 'all', askInvDel: '', invBusy: false, allOpts: false   // two-tap confirmations (browser pop-ups can be blocked)
};

// Photos are shrunk on the phone/computer before upload (max 1600 px wide, JPEG).
function shrink(file) {
  return new Promise((ok, bad) => {
    if (!/^image\//.test(file.type)) return bad(new Error('Pick a photo (JPG or PNG).'));
    const rd = new FileReader();
    rd.onerror = () => bad(new Error('Could not read that photo.'));
    rd.onload = () => {
      const im = new Image();
      im.onerror = () => bad(new Error('Could not open that photo.'));
      im.onload = () => {
        const sc = Math.min(1, 1600 / im.width), w = Math.round(im.width * sc), h = Math.round(im.height * sc);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
let photoFor = null;
async function onPhoto(file) {
  try {
    const data = await shrink(file);
    if (photoFor === 'new') { A.slides.push({ id: '', title: '', sub: '', itemId: '', active: true, img: data, imgData: data }); }
    else if (A.slides[photoFor]) { A.slides[photoFor].img = data; A.slides[photoFor].imgData = data; }
    A.dirty = true; A.sMsg = ''; A.sErr = ''; render();
    if (photoFor === 'new') { const last = document.querySelector('.scard:last-child input'); if (last) { last.scrollIntoView({ block: 'center' }); last.focus(); } }
  } catch (e) { A.sErr = e.message; render(); }
}
async function saveSlides() {
  if (A.slides.length > 12) { A.sErr = 'You can have up to 12 slides.'; return render(); }
  A.saving = true; A.sErr = ''; render();
  try {
    await call('PUT', '/slides', { seconds: A.seconds, slides: A.slides.map(x => ({ id: x.id, title: x.title, sub: x.sub, itemId: x.itemId, active: x.active, imgData: x.imgData || undefined })) });
    A.saving = false; await loadSlides(); A.sMsg = 'Saved. Customers see the new slideshow now.'; render();
  } catch (e) { A.saving = false; A.sErr = e.message; render(); }
}

    <button class="tlink" data-signout>Sign out</button>
  </div></header>
  ${DEMO ? '<div class="demo">Demo · sample numbers, nothing here is real</div>' : ''}
  <nav class="tabsbar"><div class="wrap" role="tablist">
    <button class="tab" role="tab" data-view="sales" aria-selected="${A.view === 'sales'}">Sales</button>
    <button class="tab" role="tab" data-view="slides" aria-selected="${A.view === 'slides'}">Slideshow</button>
    <button class="tab" role="tab" data-view="customers" aria-selected="${A.view === 'customers'}">Customers</button>
    <button class="tab" role="tab" data-view="inventory" aria-selected="${A.view === 'inventory'}">Inventory</button>
    <button class="tab" role="tab" data-view="settings" aria-selected="${A.view === 'settings'}">Settings</button>
  </div></nav>
  <main class="wrap">${notice()}${A.view === 'sales' ? vSales() : A.view === 'slides' ? vSlides() : A.view === 'customers' ? vCustomers() : A.view === 'inventory' ? vInventory() : vSettings()}</main>
  ${saveBar()}`;
  window.scrollTo(0, y);
}

/* ---------- events ---------- */
document.addEventListener('submit', e => {
  if (e.target.id === 'loginForm') { e.preventDefault(); const u = ($('#user').value || '').trim(), pw = $('#pass').value || ''; if (u && pw) signIn(u, pw); return; }
  if (e.target.id === 'pwForm') {
    e.preventDefault();
    const body = { user: ($('#pw-user').value || '').trim(), current: $('#pw-cur').value || '', next: $('#pw-new').value || '' };
    A.pwErr = ''; A.pwMsg = '';
    if (body.next.length < 6) { A.pwErr = 'The new password must have at least 6 characters.'; render(); return; }
    A.pwBusy = true; render();
    call('POST', '/password', body).then(j => { A.pwBusy = false; A.user = j.user; A.defaultPw = false; A.pwMsg = 'Password changed. Use it next time you sign in.'; render(); })
      .catch(err => { A.pwBusy = false; A.pwErr = err.message; render(); });
    return;
  }
  if (e.target.id === 'invEditForm') {
    e.preventDefault();
    const v = id => ($(id) || {}).value;
    const body = { id: A.invEdit.id, name: (v('#ie-name') || '').trim(), unit: v('#ie-unit'), low: v('#ie-low'), cost: v('#ie-cost') };
    if (!A.invEdit.id) body.stock = v('#ie-stock');
    if (!body.name) { A.invErr = 'Write a name for the ingredient.'; render(); return; }
    invCall('PUT', '/inventory/item', body, 'Ingredient saved.'); return;
  }
  if (e.target.id === 'invMoveForm') {
    e.preventDefault();
    const qty = ($('#mv-qty').value || '').trim().replace(',', '.');
    if (qty === '' || !(Number(qty) >= 0)) { A.invErr = 'Write a number (0 or more).'; render(); return; }
    invCall('POST', '/inventory/move', { inv: A.invMove.id, type: A.invMove.type, qty: Number(qty), note: $('#mv-note').value }, 'Saved.'); return;
  }
  if (e.target.id === 'eraseForm') {
    e.preventDefault();
    const er = A.er; er.err = ''; er.msg = '';
    if (($('#er-confirm').value || '').trim().toUpperCase() !== 'ERASE') { er.err = 'Type ERASE in the box to confirm.'; render(); return; }
    er.busy = true; render();
    call('POST', '/erase', { orders: er.orders, customers: er.customers, confirm: 'ERASE' }).then(j => {
      er.busy = false; er.msg = `Done. Erased ${int(j.orders)} order${j.orders === 1 ? '' : 's'} and ${int(j.customers)} customer account${j.customers === 1 ? '' : 's'}.`;
      A.days = []; A.orders = null; A.ordersKey = ''; A.custs = null; render(); loadSales();
    }).catch(err => { er.busy = false; er.err = err.message; render(); });
    return;
  }
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) { if (!e.target.closest('#chart')) showTip(null); return; }
  const d = t.dataset;
  if ('invstarter' in d) { invCall('POST', '/inventory/starter', {}, 'Starter list loaded. Now use Count to enter what you have.'); return; }
  if ('invnew' in d) { A.invEdit = { id: '', unit: 'unid' }; A.invMove = null; A.recEdit = null; A.invMsg = ''; render(); const n = $('#ie-name'); if (n) n.focus(); return; }
  if (d.invedit) { const g = ingById(d.invedit); A.invEdit = Object.assign({}, g); A.invMove = null; A.recEdit = null; A.invMsg = ''; A.askInvDel = ''; render(); return; }
  if ('invcancel' in d) { A.invEdit = null; A.invMove = null; A.recEdit = null; A.askInvDel = ''; render(); return; }
  if (d.invdel) { if (A.askInvDel !== d.invdel) { A.askInvDel = d.invdel; render(); return; } invCall('DELETE', '/inventory/item/' + encodeURIComponent(d.invdel), null, 'Ingredient deleted.'); return; }
  if (d.mv) { A.invMove = { id: d.id, type: d.mv }; A.invEdit = null; A.recEdit = null; A.invMsg = ''; render(); const q = $('#mv-qty'); if (q) q.focus(); return; }
  if (d.reccat) { A.recCat = d.reccat; render(); return; }
  if ('allopts' in d) { A.allOpts = !A.allOpts; render(); return; }
  if (d.redit) {
    const key = d.redit, V = A.inv, raw = key.slice(key.indexOf(':') + 1);
    const lines = d.rkind === 'item' ? V.recipes[raw] : V.optRecipes[raw];
    A.recEdit = { key, kind: d.rkind, raw, lines: (lines || []).map(l => ({ inv: l.inv, qty: l.qty })) };
    if (!A.recEdit.lines.length) A.recEdit.lines.push({ inv: '', qty: 1 });
    A.invEdit = null; A.invMove = null; A.invMsg = ''; render(); return;
  }
  if ('radd' in d) { A.recEdit.lines.push({ inv: '', qty: 1 }); render(); return; }
  if (d.rdel != null) { A.recEdit.lines.splice(Number(d.rdel), 1); render(); return; }
  if ('rsave' in d) {
    const r = A.recEdit, lines = r.lines.filter(l => l.inv && Number(l.qty) > 0);
    invCall('PUT', '/inventory/recipe', r.kind === 'item' ? { item: r.raw, lines } : { opt: r.raw, lines }, 'Recipe saved.'); return;
  }
  if (d.resetpw) {
    if (A.askPw !== d.resetpw) { A.askPw = d.resetpw; render(); return; }
    A.askPw = '';
    call('POST', '/customers/' + encodeURIComponent(d.resetpw) + '/reset').then(j => { A.temp[d.resetpw] = j.temp; render(); }).catch(err => { A.custErr = err.message; render(); });
    return;
  }
  if (A.askPw) { A.askPw = ''; if (A.view === 'customers') render(); }
  if (d.del == null && !('resetslides' in d) && (A.askDel >= 0 || A.askReset)) { A.askDel = -1; A.askReset = false; if (A.view === 'slides') render(); }
  if (d.er) { A.er[d.er] = !A.er[d.er]; A.er.err = ''; A.er.msg = ''; render(); return; }
  if ('signout' in d) { signOut(); return; }
  if ('reload' in d) { loadSales(); return; }
  if ('more' in d) { A.showN += 20; render(); return; }
  if (d.view) {
    A.view = d.view; window.scrollTo(0, 0); render();
    if (A.view === 'slides' && !A.slides) loadSlides();
    if (A.view === 'customers') loadCustomers();
    if (A.view === 'inventory') { A.invMsg = ''; loadInv(); }
    if (A.view === 'sales') loadOrders();
    return;
  }
  if (d.ch) { A.ch = d.ch; render(); return; }
  if (d.glance) { A.kind = d.glance; A.anchor = A.today; render(); loadOrders(); return; }
  if (d.kind) { A.kind = d.kind; render(); loadOrders(); return; }
  if (d.shift) { A.anchor = shift(A.kind, A.anchor, Number(d.shift)); render(); loadOrders(); return; }
  if (d.metric) { A.metric = d.metric; render(); return; }
  if (d.col != null) { showTip(t); return; }
  if ('addslide' in d) { if (A.slides.length >= 12) { A.sErr = 'You can have up to 12 slides.'; render(); return; } photoFor = 'new'; $('#file').value = ''; $('#file').click(); return; }
  if (d.photo != null) { photoFor = Number(d.photo); $('#file').value = ''; $('#file').click(); return; }
  if (d.act != null) { const x = A.slides[Number(d.act)]; x.active = !x.active; A.dirty = true; A.sMsg = ''; A.pv = 0; render(); return; }
  if (d.move != null) { const i = Number(d.move), j = i + Number(d.d); if (j < 0 || j >= A.slides.length) return; const s = A.slides; [s[i], s[j]] = [s[j], s[i]]; A.dirty = true; A.sMsg = ''; A.pv = 0; render(); return; }
  if (d.del != null) { const i = Number(d.del); if (A.askDel !== i) { A.askDel = i; A.askReset = false; render(); return; } A.askDel = -1; A.slides.splice(i, 1); A.dirty = true; A.sMsg = ''; A.pv = 0; render(); return; }
  if ('discard' in d) { loadSlides(); return; }
  if ('saveslides' in d) { saveSlides(); return; }
  if ('resetslides' in d) {
    if (!A.askReset) { A.askReset = true; A.askDel = -1; render(); return; }
    A.askReset = false;
    call('DELETE', '/slides').then(() => loadSlides()).then(() => { A.sMsg = 'The starter slides are back.'; render(); }).catch(err => { A.sErr = err.message; render(); });
    return;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.rl != null && A.recEdit) { const l = A.recEdit.lines[Number(el.dataset.rl)]; if (l) l[el.dataset.rf] = el.dataset.rf === 'qty' ? el.value.replace(',', '.') : el.value; return; }
  if (el.id === 'cq') { A.custQ = el.value; const pos = el.selectionStart; render(); const c = $('#cq'); if (c) { c.focus(); try { c.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (el.id === 'secs') { const v = Math.round(Number(el.value)); if (v >= 2 && v <= 30) { A.seconds = v; markDirty(); schedPreview(); const s = document.querySelector('.card h2 .sub'); if (s) s.textContent = 'Changes every ' + v + ' seconds'; } return; }
  if (el.dataset.f && el.dataset.i != null) { const x = A.slides[Number(el.dataset.i)]; if (!x) return; x[el.dataset.f] = el.value; markDirty(); refreshPreview(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'file' && e.target.files && e.target.files[0]) onPhoto(e.target.files[0]);
  if (e.target.dataset && e.target.dataset.rl != null && A.recEdit) { const l = A.recEdit.lines[Number(e.target.dataset.rl)]; if (l) { l[e.target.dataset.rf] = e.target.value; if (e.target.dataset.rf === 'inv') render(); } return; }
  if (e.target.dataset && e.target.dataset.f === 'itemId') { const x = A.slides[Number(e.target.dataset.i)]; if (x) { x.itemId = e.target.value; markDirty(); } }
});
document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const c = e.target.closest && e.target.closest('.col'); if (c) showTip(c); });
document.addEventListener('pointerout', e => { if (e.pointerType !== 'mouse') return; if (e.target.closest && e.target.closest('.cols') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.cols'))) showTip(null); });
document.addEventListener('focusin', e => { const c = e.target.closest && e.target.closest('.col'); if (c) showTip(c); });
addEventListener('beforeunload', e => { if (A.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- start ---------- */
render();
schedPreview();
if (TOKEN) startSession();
</script>
</body>
</html>
